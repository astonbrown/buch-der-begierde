<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buch der Begierde — Ein interaktives Leseerlebnis</title>
    <meta name="description" content="Ein interaktives, literarisches Web-Artefakt. Wortfragmente, Resonanz, dynamische Erinnerungen.">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Stylesheets (modular) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/atmosphere.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="landing-body">

    <!-- Atmosphäre & Grain -->
    <div class="atmosphere"></div>
    <div class="grain-overlay"></div>
    <div class="particles" id="particles"></div>

    <!-- Page Transition Overlay -->
    <div class="page-transition" id="pageTransition"></div>

    <!-- ===== Buch-Szene ===== -->
    <div class="book-scene">
        <div class="book-3d">

            <!-- Buchrücken -->
            <div class="book-spine"></div>

            <!-- Buchseiten (sichtbar wenn Deckel offen) -->
            <div class="book-pages">
                <div class="page-left">
                    <div class="page-chapter">Kapitel I</div>
                    <div class="page-title">Die Nacht legte sich über die Stadt&hellip;</div>
                </div>
                <div class="page-right">
                    <div class="page-text">
                        &hellip;wie ein Samtgewebe, das jede Bewegung verschluckte.
                        Ich stand am Fenster und beobachtete das Licht der Laternen.
                    </div>
                </div>
            </div>

            <!-- Buchdeckel (öffnet sich) -->
            <div class="book-cover">
                <div class="cover-front">
                    <div class="cover-diamond"><span>B</span></div>
                    <h1 class="cover-title">Buch der <em>Begierde</em></h1>
                    <div class="cover-line"></div>
                    <div class="cover-subtitle">Ein interaktives Leseerlebnis</div>
                </div>
                <div class="cover-back"></div>
            </div>

        </div>
        <!-- Schatten unter dem Buch -->
        <div class="book-shadow"></div>
    </div>

    <!-- ===== Menu ===== -->
    <nav class="intro-menu">
        <button class="menu-btn" id="menuLesen" aria-label="Lesen — betritt die Geschichte">
            <i class="fas fa-book-open"></i>
            <span class="menu-label">Lesen</span>
        </button>
        <button class="menu-btn" id="menuHoeren" aria-label="Hören — Geschichte als Stimme">
            <i class="fas fa-volume-up"></i>
            <span class="menu-label">Hören</span>
        </button>
        <button class="menu-btn" id="menuSchreiben" aria-label="Schreiben — eigene Zeile hinzufügen">
            <i class="fas fa-feather"></i>
            <span class="menu-label">Schreiben</span>
        </button>
        <button class="menu-btn" id="menuArchiv" aria-label="Archiv — Gedächtnis-Explorer">
            <i class="fas fa-archive"></i>
            <span class="menu-label">Archiv</span>
        </button>
    </nav>

    <!-- ===== Footer ===== -->
    <footer class="intro-footer">
        <span>Buch der Begierde · v0.5.0</span>
        <span><a href="analyse.html">Geräteanalyse</a> · Vanilla ES6</span>
    </footer>

    <!-- ===== Entry-Point ===== -->
    <script type="module" src="js/app-landing.js"></script>
</body>
</html>
